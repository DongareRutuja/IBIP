    .card {
      width: 340px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 28px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .card h1.app-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #3a7bd5;
      letter-spacing: 1px;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px solid #d0e4fa;
      font-family: 'Nunito', Arial, sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search input:focus {
      border-color: #4facfe;
    }

    .search button {
      padding: 10px 16px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Nunito', Arial, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .search button:hover { opacity: 0.9; }
    .search button:active { transform: scale(0.97); }

    .weather {
      display: none;
    }

    .weather.visible {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .weather img#icon {
      width: 90px;
      height: 90px;
      margin: 0 auto;
      display: block;
    }

    #cityName {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1a2a4a;
      margin-bottom: 4px;
    }

    #temp {
      font-size: 3rem;
      font-weight: 800;
      color: #3a7bd5;
      line-height: 1.1;
    }

    #condition {
      font-size: 1rem;
      font-weight: 600;
      color: #555;
      margin: 4px 0 10px;
      text-transform: capitalize;
    }

    #time {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 14px;
    }

    .details {
      display: flex;
      justify-content: space-around;
      background: rgba(79,172,254,0.1);
      border-radius: 12px;
      padding: 12px 8px;
      margin-top: 6px;
    }

    .details p {
      font-size: 0.85rem;
      color: #444;
      font-weight: 600;
    }

    .details p span {
      color: #3a7bd5;
      font-weight: 800;
    }

    #error-msg {
      color: #e55;
      font-size: 0.85rem;
      margin-top: 8px;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1 class="app-title">☁ Weather App</h1>

  <div class="search">
    <input type="text" placeholder="Enter city name..." id="city" onkeydown="if(event.key==='Enter') getWeather()">
    <button onclick="getWeather()">Search</button>
  </div>

  <div id="error-msg"></div>

  <div class="weather" id="weatherBox">
    <h2 id="cityName"></h2>
    <img id="icon" src="" alt="weather icon">
    <h1 id="temp"></h1>
    <h3 id="condition"></h3>
    <p id="time"></p>
    <div class="details">
      <p>💧 Humidity: <span id="humidity"></span></p>
      <p>💨 Wind: <span id="wind"></span></p>
    </div>
  </div>
</div>

<script>
  async function getWeather() {
    const city = document.getElementById("city").value.trim();
    const errorMsg = document.getElementById("error-msg");
    const weatherBox = document.getElementById("weatherBox");

    errorMsg.textContent = "";
    if (!city) {
      errorMsg.textContent = "Please enter a city name.";
      return;
    }

    const apiKey = "6f645323337e1c68e593a5667df65327";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${apiKey}`;

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.cod !== 200) {
        errorMsg.textContent = data.message || "City not found.";
        weatherBox.classList.remove("visible");
        return;
      }

      document.getElementById("cityName").textContent = data.name + ", " + data.sys.country;
      document.getElementById("temp").textContent = Math.round(data.main.temp) + "°C";
      document.getElementById("condition").textContent = data.weather[0].description;
      document.getElementById("humidity").textContent = data.main.humidity + "%";
      document.getElementById("wind").textContent = data.wind.speed + " km/h";

      const iconCode = data.weather[0].icon;
      document.getElementById("icon").src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

      const timezone = data.timezone;
      const localTime = new Date(Date.now() + (timezone + new Date().getTimezoneOffset() * 60) * 1000);
      document.getElementById("time").textContent = "Local Time: " + localTime.toLocaleString("en-GB", {
        hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short", year: "numeric"
      });

      weatherBox.classList.add("visible");
    } catch (err) {
      errorMsg.textContent = "Network error. Please try again.";
    }
  }
</script>

</body>
</html>
